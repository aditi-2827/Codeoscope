services:
  # ── PostgreSQL Database ────────────────────────────────────────────────────
  db:
    image: postgres:13.0
    env_file: judge0.conf
    volumes:
      - postgres-data:/var/lib/postgresql/data/
    restart: always

  # ── Redis Queue ────────────────────────────────────────────────────────────
  redis:
    image: redis:6.0
    command:
      - /bin/sh
      - -c
      - redis-server --requirepass "$${REDIS_PASSWORD:?REDIS_PASSWORD variable is not set}"
    env_file: judge0.conf
    restart: always

  # ── Judge0 API Server ──────────────────────────────────────────────────────
  server:
    image: judge0/judge0:1.13.1
    env_file: judge0.conf
    ports:
      - "2358:2358"
    privileged: true
    restart: always
    depends_on:
      - db
      - redis

  # ── Judge0 Workers (code execution sandbox) ────────────────────────────────
  workers:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    env_file: judge0.conf
    privileged: true
    restart: always
    depends_on:
      - server

volumes:
  postgres-data:
